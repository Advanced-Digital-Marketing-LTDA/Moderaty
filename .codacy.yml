---
exclude_paths:
  - 'svelte.config.js'
  - '.svelte-kit/**'
  - 'build/**'
  - 'node_modules/**'
  # Generated drizzle migrations: SQLite-only SQL where T-SQL schema
  # qualification and ANSI portability rules do not apply — and the org's
  # leftover "Enforce Access to RAC_* Tables in SQL Queries" custom Semgrep
  # pattern fires on every migration. The per-engine exclusion did not
  # suppress it (the org pattern runs under a different tool id), so the
  # directory is excluded top-level until the pattern is deleted in the
  # Codacy dashboard (see TODO.md).
  - 'drizzle/**'
engines:
  # Test files use patterns (mock calls, stringified assertions) that trip
  # correctness rules intended for production code.
  opengrep:
    exclude_paths:
      - '**/*.test.ts'

