name: Ratchets

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ratchets:
    name: Test, suppress and type ratchets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read candidate files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Read ratchet scripts and baselines from the PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'

      - name: Run the ratchets
        shell: bash
        run: |
          set -euo pipefail
          # The base revision's scripts and baselines judge the candidate, so a
          # PR cannot loosen its own gate. Only the introducing PR has no base
          # copy; it is judged by its own files and needs maintainer review.
          policy="$GITHUB_WORKSPACE/policy"
          if [ ! -f "$policy/scripts/ratchets/run.mjs" ] || [ ! -f "$policy/.github/ratchets/baselines.json" ]; then
            echo '::warning::Bootstrap: the base branch has no ratchet scripts or baselines. Maintainer review is required before they become trusted.'
            policy="$GITHUB_WORKSPACE/candidate"
          fi
          node "$policy/scripts/ratchets/run.mjs" \
            --root "$GITHUB_WORKSPACE/candidate" \
            --baseline "$policy/.github/ratchets/baselines.json" \
            --ratchet all
