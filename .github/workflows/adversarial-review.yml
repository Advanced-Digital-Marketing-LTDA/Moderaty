name: Adversarial review

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs never receive secrets, so the job is skipped for them (shown as
    # skipped in the checks list). A missing token on a same-repo PR fails loudly.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLAUDE_CODE_SUBAGENT_MODEL: haiku
      CLAUDE_CODE_SUBAGENT_MODEL_FORCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Require the Claude OAuth token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN is not set; the adversarial review cannot run.'
            exit 1
          fi
      - name: Install the reviewer and native Claude CLI it drives
        run: |
          # Main Claude Code package needs a postinstall; install the native binary directly.
          npm install --global --ignore-scripts --no-audit --no-fund adversarial-review@2.11.1 @anthropic-ai/claude-code-linux-x64@2.1.300
          echo "$(npm root --global)/@anthropic-ai/claude-code-linux-x64" >> "$GITHUB_PATH"
      - name: Verify Claude CLI installation
        run: claude --version
      # Temporary Haiku OAuth diagnostic (no prompt/token/error body logged).
      - name: Temporary Haiku OAuth diagnostic
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude --model haiku --print --output-format json --max-turns 1 "Reply OK." > "$RUNNER_TEMP/haiku-status.json" 2> "$RUNNER_TEMP/haiku-status.err"
          cli_exit=$?
          set -e
          node -e '
            const fs = require("node:fs");
            let obj;
            try { obj = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/haiku-status.json", "utf8")); } catch { obj = {}; }
            const status = obj.api_error_status ?? obj.error_status ?? null;
            const problem = String(obj.result ?? obj.error ?? "");
            const type = status===429 || /429|rate.limit/i.test(problem) ? "rate-limit" : status===401 ? "authentication" : status===403 ? "access" : status===404 ? "model-not-found" : status ? "provider-error" : obj.is_error ? "unclassified-error" : "none";
            console.log("Haiku diagnostic: " + JSON.stringify({is_error: obj.is_error ?? null, terminal_reason: obj.terminal_reason ?? null, status, type}));
            if(obj.is_error) process.exitCode=1;
          '
          if [ "$cli_exit" -ne 0 ]; then echo "::error::Claude CLI exited nonzero; raw provider output withheld"; exit "$cli_exit"; fi
      - name: Adversarial review (two passes, findings verified)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          adversarial-review --provider claude --model haiku --base "$BASE_SHA" \
            --passes 2 --verify --fail-on high --fail-on-empty
