name: Claude Code Review
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # Force toolkit subagents (including the Opus-configured reviewer) onto Haiku.
      CLAUDE_CODE_SUBAGENT_MODEL: haiku
      CLAUDE_CODE_SUBAGENT_MODEL_FORCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: pr-review-toolkit@claude-code-plugins
          # Deterministically block unconfirmed/probe comments; no older-model classifier.
          settings: |
            {
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "mcp__github_inline_comment__create_inline_comment",
                    "hooks": [
                      {
                        "type": "command",
                        "command": "node -e 'let s=\"\";process.stdin.on(\"data\",x=>s+=x);process.stdin.on(\"end\",()=>{let ok=false;try{const x=JSON.parse(s);ok=x?.tool_input?.confirmed===true;}catch{}if(!ok){process.stderr.write(\"Inline comment requires confirmed=true; no probe posts.\\n\");process.exitCode=2;}});'"
                      }
                    ]
                  }
                ]
              },
              "env": {
                "CLAUDE_CODE_SUBAGENT_MODEL": "haiku",
                "CLAUDE_CODE_SUBAGENT_MODEL_FORCE": "1"
              }
            }
          # The pinned action's classifier requests an older Haiku; don't run it.
          classify_inline_comments: 'false'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Run /pr-review-toolkit:review-pr all against this pull request. The
            pr-test-analyzer and silent-failure-hunter agents are mandatory.
            Post the combined findings as inline comments and one summary comment.
            Only post inline comments with confirmed: true after checking each
            finding. Never probe the comment tool: a deterministic hook rejects
            missing or false confirmation.
          claude_args: '--model haiku --max-turns 30 --allowedTools "Task,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git status:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
